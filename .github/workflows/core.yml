name: Core

on:
  push:
  pull_request:

jobs:
  linux:
    name: AgrypnosCore on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Test + file-size cap
        run: |
          chmod +x Scripts/verify-linux.sh Scripts/check-file-sizes.sh
          ./Scripts/verify-linux.sh
